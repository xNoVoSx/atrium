name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach atrium.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/atrium/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Zip the integration
        working-directory: custom_components/atrium
        run: zip -r "$GITHUB_WORKSPACE/atrium.zip" . -x '__pycache__/*'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" atrium.zip --clobber
