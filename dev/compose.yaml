# Disposable Home Assistant instance for developing Atrium.
#
# Meant to run as a Git-based Portainer stack (or `docker compose up -d`).
# Differences from the official Home Assistant Container example, on purpose:
#   - bridge network with a published port instead of `network_mode: host`,
#     so the test instance does not discover real devices on the LAN and
#     does not clash with another Home Assistant on port 8123
#   - no `privileged` and no D-Bus mount (no Bluetooth or USB needed)
#
# Variables (set them in the Portainer stack or in a local .env file):
#   HA_VERSION     Home Assistant image tag, keep it equal to the production version
#   HA_CONFIG_DIR  absolute host path for /config (no relative paths: Portainer
#                  Git stacks resolve them inside the cloned repository)
#   HA_PORT        host port for the web UI
#   TZ             time zone

services:
  homeassistant:
    container_name: ha-test
    image: "ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.9.3}"
    volumes:
      - ${HA_CONFIG_DIR:-/docker/ha-test}:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HA_PORT:-8124}:8123"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    restart: unless-stopped
    stop_grace_period: 60s
